    <script>
      // Force HTTPS. Localhost is exempt so development still works.
      (function () {
        var h = window.location.hostname;
        var local = h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local');
        if (!local && window.location.protocol === 'http:') {
          window.location.replace(
            'https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash
          );
        }
      })();
